server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache hashed build assets (filenames change every build).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Never cache the service worker, its registration, or the manifest — otherwise
  # Cloudflare/browsers can pin an old PWA version and deploys don't propagate.
  location = /sw.js            { add_header Cache-Control "no-cache" always; }
  location = /registerSW.js    { add_header Cache-Control "no-cache" always; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache" always; }

  # German shell — its own indexable URL with a localized <head>.
  location ~ ^/de(/.*)?$ {
    add_header Cache-Control "no-cache" always;
    try_files $uri /de/index.html;
  }

  # SPA fallback (English). HTML is revalidated so the latest bundle is referenced.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
