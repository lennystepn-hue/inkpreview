# InkPreview — production / VPS stack.
# Local dev does NOT need this (uv + npm run with zero infra). This is the
# deploy target: Postgres + Redis + backend + arq worker + frontend.
#
#   cp .env.example .env   # fill in real values (OPENAI_API_KEY, SESSION_SECRET, …)
#   docker compose up -d --build
#
# Put a TLS reverse proxy (Caddy/Traefik) in front — see docs/DEPLOY.md. It
# routes /api/* and /media/* to `backend`, everything else to `frontend`.
# Media is stored on a shared volume and served by the backend (same-origin),
# so display + downloads work without object storage. For scale, switch to
# S3/MinIO (STORAGE_BACKEND=s3) — see docs/DEPLOY.md.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inkpreview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inkpreview}
      POSTGRES_DB: ${POSTGRES_DB:-inkpreview}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inkpreview}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      APP_ENV: prod
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-inkpreview}:${POSTGRES_PASSWORD:-inkpreview}@postgres:5432/${POSTGRES_DB:-inkpreview}
      REDIS_URL: redis://redis:6379
      JOB_MODE: arq
      STORAGE_BACKEND: fs
      STORAGE_DIR: /app/data/media
      MEDIA_BASE_URL: /media
      CORS_ORIGINS: "https://ink-preview.com,https://www.ink-preview.com,http://localhost:5173"
    volumes:
      - media-data:/app/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    expose:
      - "8000"
    healthcheck:
      # /api/ready verifies DB + Redis reachability — an unhealthy backend is
      # surfaced (and restarted) instead of silently serving 500s.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: .env
    environment:
      APP_ENV: prod
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-inkpreview}:${POSTGRES_PASSWORD:-inkpreview}@postgres:5432/${POSTGRES_DB:-inkpreview}
      REDIS_URL: redis://redis:6379
      JOB_MODE: arq
      STORAGE_BACKEND: fs
      STORAGE_DIR: /app/data/media
      MEDIA_BASE_URL: /media
      CORS_ORIGINS: "https://ink-preview.com,https://www.ink-preview.com,http://localhost:5173"
    volumes:
      - media-data:/app/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build: ./frontend
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  media-data:
