[project]
name = "inkpreview-backend"
version = "0.1.0"
description = "InkPreview backend — AI tattoo designer core loop"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "greenlet>=3.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "arq>=0.26",
    "redis>=5.2",
    "aioboto3>=13.2",
    "pillow>=11.0",
    "openai>=1.59",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "sentry-sdk[fastapi]>=2.20",
    "stripe>=11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["app/tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic auto-generates migration files; don't fight its formatting.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection callables are designed to be used in defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Cookie",
    "fastapi.Security",
]
